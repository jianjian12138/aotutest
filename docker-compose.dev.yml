version: '3.8'

# 开发环境编排。任务队列使用 django-q2（qcluster），不使用 Celery。

services:
  # Redis服务（缓存，可选）
  redis:
    image: redis:7-alpine
    container_name: testing-platform-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - testing-network

  # Django后端服务（开发模式）
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: testing-platform-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-only-for-local}
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    volumes:
      # 开发模式挂载整个项目根目录以支持热更新（与镜像 /app 结构一致）
      - .:/app
      - backend_media_dev:/app/media
      - backend_logs_dev:/app/logs
    depends_on:
      - redis
    networks:
      - testing-network
    command: python manage.py runserver 0.0.0.0:8000

  # django-q2 任务集群（开发模式）
  qcluster:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: testing-platform-qcluster-dev
    restart: unless-stopped
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-only-for-local}
    volumes:
      - .:/app
      - backend_media_dev:/app/media
      - backend_logs_dev:/app/logs
    depends_on:
      - backend
    networks:
      - testing-network
    command: python manage.py qcluster

  # Vue前端服务（开发模式）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testing-platform-frontend-dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - testing-network

networks:
  testing-network:
    driver: bridge

volumes:
  backend_media_dev:
    driver: local
  backend_logs_dev:
    driver: local
