# 本地开发兜底配置。
# 优先级：环境变量 > 本文件 > 安全默认值。
# 安全要求：
#  - 本文件禁止存放任何真实密钥/口令（secret_key 请用 SECRET_KEY 环境变量提供）
#  - debug 默认关闭，本地调试需显式改 true 或设置环境变量 DEBUG=True

# 服务配置
server:
  frontend_port: 5656
  backend_port: 4545
  backend_host: "127.0.0.1"
  frontend_url: "http://localhost:5656"
  debug: false

# 数据库配置 (SQLite / MySQL / PostgreSQL)
# 生产环境请使用 DB_* 环境变量，本段仅作本地开发兜底
database:
  engine: "django.db.backends.sqlite3"
  name: "db.sqlite3"
  user: ""
  password: ""
  host: ""
  port: ""

# Redis 配置 (缓存，可选；任务队列使用 django-q2 ORM broker)
redis:
  url: "redis://localhost:6379/0"

# JWT 配置
jwt:
  access_token_lifetime: 60
  refresh_token_lifetime: 7
