version: '3.8'

# 生产环境编排（在项目根目录执行：docker compose -f deploy/docker-compose.prod.yml up -d）
# 任务队列使用 django-q2（qcluster），不使用 Celery。
# 注意：build context 为项目根目录的上一级相对路径 ..（本文件位于 deploy/ 下）。

x-backend-env: &backend-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?生产必须设置强随机 SECRET_KEY}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?生产必须设置独立的字段加密密钥}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?生产必须设置 ALLOWED_HOSTS 白名单}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${POSTGRES_DB:?}
  DB_USER: ${POSTGRES_USER:?}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?}
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  # 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: test_platform_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - test_platform_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis服务（缓存，可选）
  redis:
    image: redis:7-alpine
    container_name: test_platform_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - test_platform_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Django后端服务
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: test_platform_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/static
    environment:
      <<: *backend-env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test_platform_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import django; django.setup(); from django.db import connection; connection.ensure_connection()\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  # django-q2 任务集群（替代原 Celery worker/beat/flower）
  qcluster:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: test_platform_qcluster
    command: python manage.py qcluster
    volumes:
      - media_volume:/app/media
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test_platform_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx（前端和反向代理，TLS 启用）
  nginx:
    image: nginx:alpine
    container_name: test_platform_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - ../frontend/dist:/var/www/html
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test_platform_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:

networks:
  test_platform_network:
    driver: bridge
