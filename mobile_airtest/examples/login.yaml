case_name: 移动端登录流程（Airtest YAML）
case_code: MobileLoginYaml
priority: 2
assets_root: login.air
steps:
  - step_name: 打开登录入口
    actions:
      - type: touch
        target: tpl1763972756114.png
        record_pos: [-0.117, -0.272]
        resolution: [900, 1600]

  - step_name: 清理历史账号信息
    actions:
      - type: if_exists
        target: tpl1763973693047.png
        record_pos: [-0.248, -0.327]
        resolution: [900, 1600]
        actions:
          - type: touch
            target: tpl1763972881224.png
            record_pos: [0.016, -0.339]
            resolution: [900, 1600]
          - type: touch
            target: tpl1763972897290.png
            record_pos: [-0.017, -0.213]
            resolution: [900, 1600]
          - type: repeat
            times: 10
            actions:
              - type: keyevent
                key: KEYCODE_DEL
        else_actions:
          - type: touch
            target: tpl1763973441073.png
            record_pos: [-0.109, -0.22]
            resolution: [900, 1600]

  - step_name: 输入企业信息
    actions:
      - type: text
        value: 格力测试啊啊
      - type: sleep
        seconds: 1.0

  - step_name: 输入账号
    actions:
      - type: touch
        target: tpl1763973011858.png
        record_pos: [-0.002, -0.033]
        resolution: [900, 1600]
      - type: touch
        target: tpl1763973050649.png
        record_pos: [-0.046, -0.111]
        resolution: [900, 1600]
      - type: text
        value: "17751020356"

  - step_name: 输入密码
    actions:
      - type: touch
        target: tpl1763973068108.png
        record_pos: [-0.092, 0.136]
        resolution: [900, 1600]
      - type: text
        value: "pms2025@!"

  - step_name: 勾选协议并登录
    actions:
      - type: touch
        target: tpl1763973080558.png
        record_pos: [-0.009, 0.397]
        resolution: [900, 1600]
      - type: touch
        target: tpl1763973565127.png
        record_pos: [0.242, 0.801]
        resolution: [900, 1600]
      - type: touch
        target: tpl1763973572481.png
        record_pos: [0.001, -0.223]
        resolution: [900, 1600]

  - step_name: 截图校验
    actions:
      - type: snapshot
        filename: login_result.png

